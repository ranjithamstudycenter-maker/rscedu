<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Payment | Ranjitham Study Center</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{
    text-align:center;
    font-family:Poppins,Arial,sans-serif;
    padding:50px;
}
input{
    padding:10px;
    margin:8px;
    width:250px;
}
button{
    padding:12px 25px;
    background:#0b5394;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}
</style>
</head>

<body>

<h2>Pay ₹{{ product.price }} to Continue</h2>
<p><b>{{ product.name }}</b></p>

<input type="email" id="email" placeholder="Enter Email" required><br>
<input type="text" id="phone" placeholder="WhatsApp Number" required><br>

<button id="rzp-button">Pay Now</button>

<script>
var product_id = "{{ product_id }}";
var mode = "{{ mode }}";
var board = "{{ board }}";
var cls = "{{ cls }}";

var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ product.price * 100 }}",
    "currency": "INR",
    "name": "Ranjitham Study Center",
    "description": "Maths Notes",
    "order_id": "{{ order_id }}",

    "handler": function (response) {

        // Redirect to flask success route
       const url =
  "/materials?open=" + encodeURIComponent(product_id) +
  "&board=" + encodeURIComponent(board) +
  "&cls=" + encodeURIComponent(cls) +
  "&paid=1";

window.location.href = url;
    "prefill":{
        "email": document.getElementById("email").value,
        "contact": document.getElementById("phone").value
    },

    "theme":{
        "color":"#0b5394"
    }
};

var rzp = new Razorpay(options);

document.getElementById('rzp-button').onclick=function(e){

    if(!document.getElementById("email").value ||
       !document.getElementById("phone").value){
        alert("Enter Email & Phone");
        return;
    }

    rzp.open();
    e.preventDefault();
}
</script>

</body>
</html>
