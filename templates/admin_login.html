<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0b5394, #6fa8dc);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .login-card img {
            width: 90px;
            margin-bottom: 15px;
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: #0b5394;
        }

        .login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .login-card input:focus {
            border-color: #0b5394;
            outline: none;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #0b5394;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-card button:hover {
            background: #073763;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="login-card">

    <!-- Logo -->
    <img src="/static/images/logo.jpg" alt="Logo">

    <h2>Admin Panel</h2>

    <form method="POST">
        <input type="password" name="password" placeholder="Enter Admin Password" required>
        <button type="submit">Login</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</div>

</body>
</html>
