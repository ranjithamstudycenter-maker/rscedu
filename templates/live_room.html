<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Class | Ranjitham Study Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#f4f7fb;
    text-align:center;
}

/* HEADER */
.header{
    padding:30px 20px;
}

.logo{
    width:70px;
    margin-bottom:10px;
}

.header h2{
    color:red;
}

/* LOADING BOX */
.main-box{
    max-width:400px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.loader{
    margin:15px auto;
    border:5px solid #eee;
    border-top:5px solid #0b5394;
    border-radius:50%;
    width:40px;
    height:40px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    100%{ transform:rotate(360deg); }
}

/* WAITING */
.container{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    padding:20px;
}

.box{
    background:white;
    padding:20px;
    border-radius:12px;
    width:250px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.box h3{
    color:#0b5394;
}
</style>

<!-- 🔥 AUTO REDIRECT -->
<script>
setTimeout(function(){
    window.location.href = "{{ meet_link }}";
}, 3000);  // 3 sec delay
</script>

</head>

<body>

<div class="header">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" class="logo">
    <h2>🔴 Connecting to Live Class...</h2>
</div>

<div class="main-box">
    <div class="loader"></div>
    <p>Please wait... redirecting to your class</p>
</div>

<!-- WAITING LIST -->
<div class="container">

<div class="box">
<h3>🇮🇳 Indian ({{ indian|length }})</h3>
{% for name in indian %}
<p>{{ name }}</p>
{% endfor %}
</div>

<div class="box">
<h3>🌍 International ({{ international|length }})</h3>
{% for name in international %}
<p>{{ name }}</p>
{% endfor %}
</div>

</div>

</body>
</html>
