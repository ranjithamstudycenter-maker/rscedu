<!DOCTYPE html>
<html>
<head>
<title>Students</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #f4f7fc;
    padding: 24px;
    margin: 0;
    color: #1e293b;
}

h2 {
    text-align: center;
    color: #173b70;
    font-size: 26px;
    font-weight: 700;
    margin: 12px 0 28px;
}

.card {
    background: #ffffff;
    padding: 26px;
    border: 1px solid #e8edf5;
    border-radius: 16px;
    box-shadow: 0 5px 22px rgba(31, 55, 90, 0.06);
    margin-bottom: 24px;
    overflow-x: auto;
}

.card h3 {
    color: #173b70;
    font-size: 18px;
    margin: 0 0 20px;
    font-weight: 700;
}

/* CLASS TABS */
.class-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.class-tab {
    padding: 10px 22px;
    border: 1px solid #dce5f2;
    border-radius: 9px;
    background: #f4f7fc;
    color: #334b6b;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.class-tab:hover {
    background: #e5efff;
    border-color: #2563eb;
    color: #1d4ed8;
}

.class-tab.active {
    background: #1d4ed8;
    color: #ffffff;
    border-color: #1d4ed8;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
}

/* TABLE */
table {
    width: 100%;
    min-width: 850px;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
}

th {
    background: #173f78;
    color: #ffffff;
    font-weight: 600;
    padding: 15px 12px;
    text-align: center;
    white-space: nowrap;
}

th:first-child {
    border-radius: 8px 0 0 0;
}

th:last-child {
    border-radius: 0 8px 0 0;
}

td {
    padding: 14px 12px;
    text-align: center;
    border-bottom: 1px solid #edf1f7;
    color: #475569;
    background: #ffffff;
}

tbody tr:hover td {
    background: #f7faff;
}

tbody tr:last-child td {
    border-bottom: none;
}

/* STATUS BADGES */
.badge {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    min-width: 48px;
}

.yes {
    background: #dcfce7;
    color: #15803d;
}

.no {
    background: #fee2e2;
    color: #b91c1c;
}

/* ACTION BUTTONS */
button {
    font-family: inherit;
}

.reset-btn,
.delete-btn {
    padding: 7px 13px;
    margin: 3px;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.reset-btn {
    background: #2563eb;
}

.reset-btn:hover {
    background: #1d4ed8;
}

.delete-btn {
    background: #dc3545;
}

.delete-btn:hover {
    background: #b91c1c;
}

/* EMPTY STATE */
.empty {
    text-align: center;
    padding: 35px !important;
    color: #94a3b8;
    font-size: 14px;
}

/* SEATS TABLE */
#seatsTable th {
    background: #173f78;
}

#seatsTable td {
    font-weight: 500;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .card {
        padding: 15px;
    }

    h2 {
        font-size: 21px;
    }
}

</style>
</head>

<body>

<h2>👨‍🎓 Students Dashboard</h2>

<div class="card">

<div class="class-tabs">
    <button class="class-tab active" onclick="filterClass('all', this)">All Students</button>
    <button class="class-tab" onclick="filterClass('cbse9', this)">Class 9</button>
    <button class="class-tab" onclick="filterClass('cbse10', this)">Class 10</button>
    <button class="class-tab" onclick="filterClass('cbse11', this)">Class 11</button>
    <button class="class-tab" onclick="filterClass('cbse12', this)">Class 12</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Course</th>
<th>OTP</th>
<th>Demo allowed</th>
<th>Demo done</th>
<th>Registered</th>
<th>Hours</th>
<th>Action</th>
</tr>
</thead>

<tbody id="StudentsHistory"></tbody>
</table>

</div>

<div class="card">
<h3>📊 Seats Info</h3>
<table id="seatsTable"></table>
</div>

<script>

let allStudents = [];

// 🔥 FETCH DATA
fetch("/admin/students")
.then(res => res.json())
.then(data => {

    // 🔥 ONLY STUDENTS (no admin filter needed now)
    allStudents = data.students;

    renderTable(allStudents);

    // 🔥 SEATS TABLE
    let sTable = document.getElementById("seatsTable");
    sTable.innerHTML = `
    <tr>
        <th>Course</th>
        <th>Total</th>
        <th>Booked</th>
        <th>Available</th>
        <th>Fill %</th>
    </tr>`;

    for (let course in data.seats){
        let d = data.seats[course];

        let fill = Math.round((d.booked / d.total) * 100);
        let color = fill >= 80 ? "red" : (fill >= 50 ? "orange" : "green");

        sTable.innerHTML += `
        <tr>
            <td>${course}</td>
            <td>${d.total}</td>
            <td>${d.booked}</td>
            <td>${d.available}</td>
            <td style="color:${color}; font-weight:bold">${fill}%</td>
        </tr>`;
    }

});


// 🔥 RENDER TABLE
function renderTable(students){

    let table = document.getElementById("StudentsHistory");
    table.innerHTML = "";

    if (students.length === 0){
        table.innerHTML = `
        <tr>
            <td colspan="6" class="empty">🚫 No students yet</td>
        </tr>`;
        return;
    }

    students.forEach(s => {

        let otp = s.otp_verified ? "Yes" : "No";
        let demoallow = s.demo_allowed ? "Yes" : "No";
        let demodone = s.demo_done ? "Yes" : "No";
        let enrolled = s.enrolled ? "Yes" : "No";

        


      
        let row = `
        <tr>
            <td>${s.name || "-"}</td>
            <td>${s.phone}</td>
            <td>${s.course}</td>   <!-- 🔥 ADD THIS -->

            <td><span class="badge ${otp=='Yes'?'yes':'no'}">${otp}</span></td>

            <td><span class="badge ${demoallow=='Yes'?'yes':'no'}">${demoallow}</span></td>

            <td><span class="badge ${demodone=='Yes'?'yes':'no'}">${demodone}</span></td>
            
            <td> <span class="badge ${enrolled=='Yes'?'yes':'no'}">${enrolled}</span> </td>

            <td>${s.hours_used || 0}</td>

            <td>
                <button class="reset-btn" onclick="resetDemo('${s.phone}','${s.course}')">Reset</button>
                <button class="delete-btn" onclick="deleteStudent('${s.phone}','${s.course}')">Delete</button>
            </td>
        </tr>`;
 
        table.innerHTML += row;
    });
}


// 🔥 FILTER
function filterClass(cls, btn){

    // 🔥 highlight active button
    document.querySelectorAll("button").forEach(b => b.style.background="#0b5394");
    btn.style.background = "orange";

    let filtered = allStudents.filter(s => 
        s.course && s.course.toLowerCase() === cls.toLowerCase()
    );

    renderTable(filtered);
}


// 🔥 RESET DEMO
function resetDemo(phone, course){
    if(confirm("Reset demo?")){
        fetch("/admin/reset-demo", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                phone: phone,
                course: course
            })
        })
        .then(res => res.json())
        .then(() => {
            alert("Demo Reset Successful ✅");
            location.reload();
        });

    }
}


// 🔥 DELETE STUDENT
function deleteStudent(phone, course){
    if(confirm("Delete student?")){
        fetch("/admin/delete-student", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ phone, course })
        })
        .then(()=> location.reload());
    }
}


// 🔥 JOIN CLASS (FINAL)
function joinClass(course) {
  fetch(`/api/join-class?course=${course}`)
  .then(res => res.json())
  .then(data => {

    if(data.error){
      alert(data.error);
      return;
    }
      
    // 🔥 save course
    localStorage.setItem("course", course);

    // 🔥 show feedback section
    document.getElementById(`feedback_${course}`).style.display = "block";

    window.location.href = data.meet_link;

  });
}


</script>

</body>
</html>
