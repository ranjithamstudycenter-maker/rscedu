<!DOCTYPE html>
<html>
<head>
<title>Students</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body { font-family:Poppins; padding:20px; background:#f5f7fa; }

h2 { text-align:center; margin-bottom:20px; }

.card {
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    margin-bottom:20px;
}

table {
    width:100%;
    border-collapse:collapse;
}

th {
    background:#0b5394;
    color:white;
}

th, td {
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.badge {
    padding:5px 10px;
    border-radius:5px;
    font-size:12px;
}

.yes { background:#d4edda; color:green; }
.no  { background:#f8d7da; color:red; }

</style>
</head>

<body>

<h2>👨‍🎓 Students Dashboard</h2>

<div class="card">
<table id="table">
<tr>
<th>Phone</th>
<th>Name</th>
<th>Demo</th>
<th>Enrolled</th>
<th>Hours Used</th>
</tr>
</table>
</div>

<div class="card">
<h3>📊 Seats Info</h3>
<table id="seatsTable">
<tr>
<th>Course</th>
<th>Available</th>
<th>Total</th>
</tr>
</table>
</div>

<script>

fetch("/admin/students")
.then(res => res.json())
.then(data => {

    let t = document.getElementById("table");

    data.students.forEach(s => {

        let demo = Object.keys(s.demo_done).length > 0 ? "Yes" : "No";
        let enrolled = Object.keys(s.enrolled).length > 0 ? "Yes" : "No";

        t.innerHTML += `
        <tr>
            <td>${s.phone}</td>
            <td>${s.name}</td>
            <td><span class="badge ${demo=='Yes'?'yes':'no'}">${demo}</span></td>
            <td><span class="badge ${enrolled=='Yes'?'yes':'no'}">${enrolled}</span></td>
            <td>${s.hours_used}</td>
        </tr>`;
    });

    // Seats table
    let sTable = document.getElementById("seatsTable");

    for (let course in data.seats){
        let d = data.seats[course];

        sTable.innerHTML += `
        <tr>
            <td>${course}</td>
            <td>${d.available}</td>
            <td>${d.total}</td>
        </tr>`;
    }

});

</script>

</body>
</html>
