<!DOCTYPE html>
<html>
<head>
<title>Students</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: Poppins;
    background: linear-gradient(135deg,#eaf2ff,#f9fbff);
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #0b5394;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    margin-bottom: 25px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: linear-gradient(90deg,#0b5394,#1f7ae0);
    color: white;
}

th, td {
    padding: 12px;
    text-align: center;
}

.badge {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.yes { background: #d4edda; color: green; }
.no  { background: #f8d7da; color: red; }

.empty {
    text-align: center;
    padding: 20px;
    color: #888;
}

button {
  padding:8px 14px;
  margin:5px;
  border:none;
  border-radius:6px;
  background:#0b5394;
  color:white;
  cursor:pointer;
}

.reset-btn{
  background:#3b82f6;
}

.delete-btn{
  background:#ef4444;
}
</style>
</head>

<body>

<h2>👨‍🎓 Students Dashboard</h2>

<div class="card">

<div style="text-align:center; margin-bottom:15px;">
    <button onclick="filterClass('cbse9', this)">Class 9</button>
    <button onclick="filterClass('cbse10', this)">Class 10</button>
    <button onclick="filterClass('cbse11', this)">Class 11</button>
    <button onclick="filterClass('cbse12', this)">Class 12</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Course</th>
<th>Demo</th>
<th>Registered</th>
<th>Hours</th>
<th>Action</th>
</tr>
</thead>

<tbody id="StudentsHistory"></tbody>
</table>

</div>

<div class="card">
<h3>📊 Seats Info</h3>
<table id="seatsTable"></table>
</div>

<script>

let allStudents = [];

// 🔥 FETCH DATA
fetch("/admin/students")
.then(res => res.json())
.then(data => {

    // 🔥 ONLY STUDENTS (no admin filter needed now)
    allStudents = data.students;

    renderTable(allStudents);

    // 🔥 SEATS TABLE
    let sTable = document.getElementById("seatsTable");
    sTable.innerHTML = `
    <tr>
        <th>Course</th>
        <th>Total</th>
        <th>Booked</th>
        <th>Available</th>
        <th>Fill %</th>
    </tr>`;

    for (let course in data.seats){
        let d = data.seats[course];

        let fill = Math.round((d.booked / d.total) * 100);
        let color = fill >= 80 ? "red" : (fill >= 50 ? "orange" : "green");

        sTable.innerHTML += `
        <tr>
            <td>${course}</td>
            <td>${d.total}</td>
            <td>${d.booked}</td>
            <td>${d.available}</td>
            <td style="color:${color}; font-weight:bold">${fill}%</td>
        </tr>`;
    }

});


// 🔥 RENDER TABLE
function renderTable(students){

    let table = document.getElementById("StudentsHistory");
    table.innerHTML = "";

    if (students.length === 0){
        table.innerHTML = `
        <tr>
            <td colspan="6" class="empty">🚫 No students yet</td>
        </tr>`;
        return;
    }

    students.forEach(s => {

        let demo = s.demo_done ? "Yes" : "No";
        let enrolled = s.enrolled ? "Yes" : "No";
      
        let row = `
        <tr>
            <td>${s.name || "-"}</td>
            <td>${s.phone}</td>
            <td>${s.course}</td>   <!-- 🔥 ADD THIS -->
            
            <td> <span class="badge ${demo=='Yes'?'yes':'no'}">${demo}</span> </td>

            <td> <span class="badge ${enrolled=='Yes'?'yes':'no'}">${enrolled}</span> </td>

            <td>${s.hours_used || 0}</td>

            <td>
                <button class="reset-btn" onclick="resetDemo('${s.phone}','${s.course}')">Reset</button>
                <button class="delete-btn" onclick="deleteStudent('${s.phone}','${s.course}')">Delete</button>
            </td>
        </tr>`;
 
        table.innerHTML += row;
    });
}


// 🔥 FILTER
function filterClass(cls, btn){

    // 🔥 highlight active button
    document.querySelectorAll("button").forEach(b => b.style.background="#0b5394");
    btn.style.background = "orange";

    let filtered = allStudents.filter(s => 
        s.course && s.course.toLowerCase() === cls.toLowerCase()
    );

    renderTable(filtered);
}


// 🔥 RESET DEMO
function resetDemo(phone, course){
    if(confirm("Reset demo?")){
        fetch("/admin/reset-demo", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                phone: phone,
                course: course
            })
        })
        .then(res => res.json())
        .then(() => {
            alert("Demo Reset Successful ✅");
            location.reload();
        });

    }
}


// 🔥 DELETE STUDENT
function deleteStudent(phone, course){
    if(confirm("Delete student?")){
        fetch("/admin/delete-student", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ phone, course })
        })
        .then(()=> location.reload());
    }
}


// 🔥 JOIN CLASS (FINAL)
function joinClass(course) {
  fetch(`/api/join-class?course=${course}`)
  .then(res => res.json())
  .then(data => {

    if(data.error){
      alert(data.error);
      return;
    }
      
    // 🔥 save course
    localStorage.setItem("course", course);

    // 🔥 show feedback section
    document.getElementById(`feedback_${course}`).style.display = "block";

    window.location.href = data.meet_link;

  });
}


</script>

</body>
</html>
