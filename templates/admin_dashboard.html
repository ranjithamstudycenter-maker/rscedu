<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body { font-family:Poppins; margin:0; background:#f5f7fa; }

.sidebar {
    width:220px;
    height:100vh;
    background:#0b5394;
    color:white;
    position:fixed;
    padding-top:20px;
}

.sidebar h3 {
    text-align:center;
}

.sidebar button {
    width:100%;
    padding:12px;
    border:none;
    background:none;
    color:white;
    cursor:pointer;
}

.sidebar button:hover {
    background:#073763;
}

.content {
    margin-left:220px;
    padding:20px;
}

iframe {
    width:100%;
    height:85vh;
    border:none;
    background:white;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="sidebar">
    <h3>Admin</h3>
    <button onclick="loadPage('/upload')">📂 Upload</button>
    <button onclick="loadPage('/manage-feedback')">⭐ Feedback</button>
    <button onclick="loadPage('/admin/students-view')">👨‍🎓 Students</button>
</div>

<div class="content">
    <iframe id="frame"></iframe>
</div>

<script>
function loadPage(url){
    document.getElementById("frame").src = url;
}

// default load
loadPage('/upload');
</script>
<!-- 💰 FACULTY SALARY MANAGEMENT -->

<div class="card">

<h2>💰 Faculty Salary Management</h2>

<table style="
width:100%;
border-collapse:collapse;
margin-top:20px;
">

<tr style="
background:#0b5394;
color:white;
">

<th style="padding:12px;">Teacher</th>

<th>Students</th>

<th>Pending</th>

<th>Paid</th>

<th>Action</th>

</tr>

{% for teacher, data in summary.items() %}

<tr style="
text-align:center;
border-bottom:1px solid #ddd;
">

<td style="padding:12px;">
{{ teacher }}
</td>

<td>
{{ data.students }}
</td>

<td style="color:orange;font-weight:bold;">
₹{{ data.pending }}
</td>

<td style="color:green;font-weight:bold;">
₹{{ data.paid }}
</td>

<td>

<a href="/mark-paid/{{ teacher }}">

<button style="
background:green;
color:white;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
">

Mark as Paid

</button>

</a>

</td>

</tr>

{% endfor %}

</table>

</div>
</body>
</html>
