<!DOCTYPE html>
<html>
<head>
<title>Manage Feedback</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: Poppins;
    background: #f5f7fa;
    padding: 20px;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* Card */
.card {
    background: white;
    padding: 15px;
    margin: 15px auto;
    max-width: 600px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

/* Name */
.name {
    font-weight: 600;
    color: #0b5394;
}

/* Status */
.status {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.approved { background:#d4edda; color:green; }
.pending { background:#fff3cd; color:orange; }

/* Buttons */
.btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.approve { background: green; color:white; }
.delete { background: red; color:white; }

</style>
</head>

<body>

<h2>⭐ Manage Feedback</h2>

<div id="container"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

// 🔥 உங்கள் config
const firebaseConfig = {
  apiKey: "YOUR KEY",
  authDomain: "YOUR DOMAIN",
  projectId: "rscedu-c1d9a",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= LOAD =================
async function loadFeedback(){
  const container = document.getElementById("container");
  container.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "feedback"));

  if(querySnapshot.empty){
    container.innerHTML = "<p style='text-align:center;'>No feedback available</p>";
    return;
  }

  querySnapshot.forEach((d) => {
    const f = d.data();

    let statusClass = f.approved ? "approved" : "pending";
    let statusText  = f.approved ? "Approved" : "Pending";

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
        <p class="name">${f.name} (${f.role})</p>
        <p>${f.message}</p>
        <p><span class="status ${statusClass}">${statusText}</span></p>

        <button class="btn approve" onclick="approve('${d.id}')">✔ Approve</button>
        <button class="btn delete" onclick="del('${d.id}')">❌ Delete</button>
    `;

    container.appendChild(div);
  });
}

// ================= APPROVE =================
window.approve = async function(id){
  const ref = doc(db, "feedback", id);

  await updateDoc(ref, {
    approved: true
  });

  loadFeedback();
}

// ================= DELETE =================
window.del = async function(id){
  const ref = doc(db, "feedback", id);

  await deleteDoc(ref);

  loadFeedback();
}

// INIT
loadFeedback();

</script>

</body>
</html>
