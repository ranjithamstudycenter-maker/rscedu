<h2 style="text-align:center;">Manage Feedback</h2>

<div id="container" style="max-width:700px; margin:auto;"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  updateDoc,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

// 🔥 same config use pannunga
const firebaseConfig = {
  apiKey: "YOUR KEY",
  authDomain: "YOUR DOMAIN",
  projectId: "rscedu-c1d9a",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= LOAD =================
async function loadFeedback(){
  const container = document.getElementById("container");
  container.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "feedback"));

  querySnapshot.forEach((d) => {
    const f = d.data();

    const div = document.createElement("div");

    div.innerHTML = `
      <div style="border:1px solid #ddd; padding:15px; margin:10px; border-radius:8px;">
        <p><b>${f.name}</b> (${f.role})</p>
        <p>${f.message}</p>
        <p>Status: ${f.approved ? "✅ Approved" : "❌ Pending"}</p>

        <button onclick="approve('${d.id}')">Approve</button>
        <button onclick="del('${d.id}')">Delete</button>
      </div>
    `;

    container.appendChild(div);
  });
}

// ================= APPROVE =================
window.approve = async function(id){
  const ref = doc(db, "feedback", id);

  await updateDoc(ref, {
    approved: true
  });

  alert("Approved ✅");
  loadFeedback();
}

// ================= DELETE =================
window.del = async function(id){
  const ref = doc(db, "feedback", id);

  await deleteDoc(ref);

  alert("Deleted ❌");
  loadFeedback();
}

// INIT
loadFeedback();

</script>
