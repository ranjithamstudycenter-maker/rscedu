<h2 style="text-align:center;">Manage Feedback</h2>

<div id="container" style="max-width:700px; margin:auto;"></div>
<script>
async function loadFeedback(){
  const res = await fetch('/admin_feedback');
  const data = await res.json();

  const c = document.getElementById("container");
  c.innerHTML = "";

  data.forEach((f, i) => {
    const div = document.createElement("div");

    div.innerHTML = `
      <div style="border:1px solid #ddd; padding:15px; margin:10px; border-radius:8px;">
        <p><b>${f.name}</b> (${f.role})</p>
        <p>${f.message}</p>
        <p>Status: ${f.approved ? "✅ Approved" : "❌ Pending"}</p>
      
        <button onclick="approve(${i})">Approve</button>
        <button onclick="del(${i})">Delete</button>
      </div>
      `;
    
    c.appendChild(div);
  });
}

async function approve(i){
  await fetch('/approve_feedback', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({index:i})
  });
  loadFeedback();
}

async function del(i){
  await fetch('/delete_feedback', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({index:i})
  });
  loadFeedback();
}

loadFeedback();
</script>
