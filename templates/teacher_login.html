<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Poppins;
  background:linear-gradient(135deg,#004aad,#0b5394);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:white;
  padding:40px;
  border-radius:15px;
  width:300px;
  text-align:center;
}

input{
  width:100%;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  background:#0b5394;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.error{
  color:red;
}
 
.logo-box {
    text-align: center;
    margin-bottom: 25px;
}
.logo-box img {
    width: 120px;
}
</style>

</head>

<body>
<div style="text-align:center; margin-bottom:20px;">
    <img src="/static/images/logo.jpg" alt="Logo" width="120">
</div>
  

<style>
.logo-box {
    text-align: center;
    margin-bottom: 25px;
}
.logo-box img {
    width: 120px;
}
</style>

<div class="box">
  <h2 style="text-align:center;">Faculty Login</h2>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="POST">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button>Login</button>
  </form>
<input type="text" id="meetLink" placeholder="Paste Google Meet Link">
<button onclick="saveClass()">Save Class</button>
</div>
  <script>function saveClass() {
  const link = document.getElementById("meetLink").value;

  fetch("/save-class", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ meetLink: link })
  });
}
  </script>

</body>
</html>
